# Keeps the free Supabase project from being paused for inactivity
# by making one read-only call a day (list of schools, no user data).
# The anon key is public by design; it already ships in the site's JavaScript.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 07:17 Toronto (EDT)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call list_schools
        env:
          SUPABASE_URL: https://zacztkzbkdwzumfeefew.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphY3p0a3pia2R3enVtZmVlZmV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjYwNjEsImV4cCI6MjEwNjU0MjA2MX0.W3npIwGw0X1E1WYBePjZJyfVuKSg8nTkgt-aVz8gNR4
        run: |
          curl -fsS --retry 3 --retry-delay 10 -X POST "$SUPABASE_URL/rest/v1/rpc/list_schools" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}' -o /dev/null -w "HTTP %{http_code}\n"
